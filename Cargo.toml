[package]
name = "lumen"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "A fast, Preview-like image and PDF viewer for Linux"
license = "GPL-3.0-or-later"
authors = ["Imanol Gomez"]

[dependencies]
# UI: Relm4 (Elm-style architecture) on top of GTK4 + libadwaita.
# Always import gtk/adw/gio/glib via `relm4::{gtk, adw}` so versions never drift.
relm4 = { version = "0.11", features = ["libadwaita", "gnome_47"] }

# PDF rendering (GPL — this is why Lumen is GPL-3.0-or-later).
poppler-rs = { version = "0.26", features = ["v25_6"] }

# Errors and logging
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
natord = "1.0.9"
kamadak-exif = "0.6.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }
little_exif = "0.6.23"
lopdf = "0.45.0"
cairo-rs = { version = "0.22", features = ["pdf", "png"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
libadwaita = { version = "0.9", features = ["v1_8"] }
gettext-rs = { version = "0.8.0", features = ["gettext-system"] }
glycin = { version = "4", features = ["gdk4"] }
futures-lite = "2"

[profile.release]
lto = "thin"
codegen-units = 1
