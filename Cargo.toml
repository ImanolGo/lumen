[package]
name = "lumen-rs"
version = "0.7.0"
edition = "2024"
rust-version = "1.92"
description = "A fast, safe image and PDF viewer for Linux, macOS and Windows, written in pure Rust with iced"
license = "GPL-3.0-or-later"
authors = ["Imanol Gomez"]
repository = "https://github.com/ImanolGo/lumen-rs"

[features]
# AVIF and HEIC through the system's libheif (C). Off by default: the default build has no C code in the document path.
heif = ["dep:libheif-rs"]

[dependencies]
iced = { version = "0.14", default-features = false, features = ["wgpu", "tiny-skia", "crisp", "thread-pool", "linux-theme-detection", "x11", "wayland", "image-without-codecs", "svg", "tokio", "canvas", "advanced"] }
hayro = "0.9"
pdf-writer = "0.15"
lopdf = { version = "0.45", default-features = false }
png = "0.18"
libheif-rs = { version = "3", optional = true, default-features = false, features = ["v1_17"] }
jxl-oxide = { version = "0.12", default-features = false }
hayro-jpeg2000 = "0.5"
jpeg-decoder = { version = "0.3", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff", "ico", "qoi", "tga", "pnm", "exr", "rayon"] }
resvg = "0.50"
kamadak-exif = "0.6"
natord = "1"
tokio = { version = "1", features = ["fs", "net", "process", "rt-multi-thread", "sync", "time", "macros"] }
bytes = "1.10"
serde = { version = "1", features = ["derive"] }
toml = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = "1"
futures = { version = "0.3", default-features = false, features = ["std"] }
subsetter = { version = "0.2.6", default-features = false }
ttf-parser = { version = "0.25", default-features = false, features = ["std", "opentype-layout"] }
jiff = { version = "1.0.3", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo", "tzdb-concatenated"] }
unicode-normalization = "0.1.26"
iced_runtime = { version = "0.14", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.14", default-features = false, features = ["tokio", "file_chooser", "open_uri", "print", "settings"] }
rustix = { version = "1", default-features = false, features = ["fs", "process", "std"] }
landlock = "0.4"
seccompiler = "0.5"
libc = "0.2"
zbus = { version = "6", default-features = false, features = ["tokio"] }
wl-clipboard-rs = "0.9.5"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
arboard = { version = "3.7.0", default-features = false, features = ["image-data"] }
directories = "6.0.0"
notify = { version = "9.0.0", default-features = false, features = ["macos_fsevent"] }
rfd = { version = "0.18.0", default-features = false }
sys-locale = "0.3.2"
trash = { version = "5.4.0", default-features = false, features = ["coinit_apartmentthreaded"] }

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21.2", default-features = false }

[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Touchpad pinch gestures. winit 0.30 reports them only on macOS and iOS, and iced
# 0.14 does not pass them on; these patched copies add Wayland pinches to winit
# (zwp_pointer_gestures_v1) and a mouse::Event::Pinched to iced. See vendor/README.md.
[patch.crates-io]
winit = { path = "vendor/winit" }
iced_core = { path = "vendor/iced_core" }
iced_winit = { path = "vendor/iced_winit" }

[package.metadata.deb]
maintainer = "ImanolGo <https://github.com/ImanolGo/lumen-rs>"
copyright = "2026, ImanolGo. GPL-3.0-or-later"
license-file = ["LICENSE", "0"]
extended-description = """\
Lumen opens pictures and PDFs quickly and keeps them safe: pure Rust, no C code in the \
document path, pictures decoded in a sandboxed process. View, search, fill in forms, \
mark up, sign, edit pictures, organise PDF pages, export and print."""
section = "graphics"
priority = "optional"
# The window system and GPU driver are loaded at run time, so they are not found by $auto.
depends = "$auto, libxkbcommon0, libwayland-client0, libvulkan1 | libgl1"
recommends = "xdg-desktop-portal, mesa-vulkan-drivers"
assets = [
    ["target/release/lumen-rs", "usr/bin/", "755"],
    ["data/io.github.imanolgo.LumenRs.desktop", "usr/share/applications/", "644"],
    ["data/io.github.imanolgo.LumenRs.metainfo.xml", "usr/share/metainfo/", "644"],
    ["data/icons/scalable/apps/io.github.imanolgo.LumenRs.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["data/icons/16x16/apps/io.github.imanolgo.LumenRs.png", "usr/share/icons/hicolor/16x16/apps/", "644"],
    ["data/icons/32x32/apps/io.github.imanolgo.LumenRs.png", "usr/share/icons/hicolor/32x32/apps/", "644"],
    ["data/icons/48x48/apps/io.github.imanolgo.LumenRs.png", "usr/share/icons/hicolor/48x48/apps/", "644"],
    ["data/icons/64x64/apps/io.github.imanolgo.LumenRs.png", "usr/share/icons/hicolor/64x64/apps/", "644"],
    ["data/icons/128x128/apps/io.github.imanolgo.LumenRs.png", "usr/share/icons/hicolor/128x128/apps/", "644"],
    ["data/icons/256x256/apps/io.github.imanolgo.LumenRs.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
    ["data/icons/512x512/apps/io.github.imanolgo.LumenRs.png", "usr/share/icons/hicolor/512x512/apps/", "644"],
    ["README.md", "usr/share/doc/lumen-rs/README", "644"],
]
