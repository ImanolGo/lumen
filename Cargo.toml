[package]
name = "lumen-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A fast, safe image and PDF viewer for Linux, written in pure Rust with iced"
license = "GPL-3.0-or-later"
authors = ["Imanol Gomez"]
repository = "https://github.com/ImanolGo/lumen-rs"

[dependencies]
iced = { version = "0.14", default-features = false, features = ["wgpu", "tiny-skia", "crisp", "thread-pool", "linux-theme-detection", "x11", "wayland", "image-without-codecs", "svg", "tokio", "canvas"] }
hayro = "0.9"
pdf-writer = "0.15"
lopdf = { version = "0.45", default-features = false }
ashpd = { version = "0.14", default-features = false, features = ["tokio", "file_chooser", "open_uri", "print", "settings"] }
png = "0.18"
jpeg-decoder = { version = "0.3", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff", "ico", "qoi", "tga", "pnm", "rayon"] }
resvg = "0.50"
kamadak-exif = "0.6"
natord = "1"
tokio = { version = "1", features = ["fs", "process", "rt-multi-thread", "sync", "time", "macros"] }
bytes = "1.10"
serde = { version = "1", features = ["derive"] }
toml = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Touchpad pinch gestures. winit 0.30 reports them only on macOS and iOS, and iced
# 0.14 does not pass them on; these patched copies add Wayland pinches to winit
# (zwp_pointer_gestures_v1) and a mouse::Event::Pinched to iced. See vendor/README.md.
[patch.crates-io]
winit = { path = "vendor/winit" }
iced_core = { path = "vendor/iced_core" }
iced_winit = { path = "vendor/iced_winit" }
