  <!-- back pages -->
  <rect x="36" y="22" width="78" height="100" rx="10" fill="#5a4d85" transform="rotate(-12 75 138)"/>
  <rect x="36" y="22" width="78" height="100" rx="10" fill="#e8795a" transform="rotate(12 75 138)"/>

  <!-- front page -->
