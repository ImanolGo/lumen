<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 150 150">
  <!-- Lumen: a fan of pages, the front one a photo above text, with a highlighter stroke -->
