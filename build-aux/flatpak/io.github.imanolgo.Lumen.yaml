# Flatpak manifest for Lumen.
#
#   flatpak-builder --user --install --force-clean build-dir build-aux/flatpak/io.github.imanolgo.Lumen.yaml
#   flatpak run io.github.imanolgo.Lumen
#
# Rust dependencies come from cargo-sources.json (regenerate with build-aux/update-cargo-sources.sh).
app-id: io.github.imanolgo.Lumen
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: lumen-viewer

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Pictures and documents in the usual places can be browsed, edited and saved in place.
  # Anything elsewhere is reached one file at a time through the file chooser portal.
  - --filesystem=xdg-pictures
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
  # The desktop's thumbnail cache, shared with the file manager.
  - --filesystem=xdg-cache/thumbnails

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin

cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/cmake
  - /share/man

modules:
  - name: openjpeg2
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_STATIC_LIBS=OFF
      - -DBUILD_DOC=OFF
      - -DBUILD_CODEC=OFF
    sources:
      - type: archive
        url: https://github.com/uclouvain/openjpeg/archive/refs/tags/v2.5.4.tar.gz
        sha256: a695fbe19c0165f295a8531b1e4e855cd94d0875d2f88ec4b61080677e27188a

  - name: poppler-data
    buildsystem: cmake-ninja
    builddir: true
    sources:
      - type: archive
        url: https://poppler.freedesktop.org/poppler-data-0.4.12.tar.gz
        sha256: c835b640a40ce357e1b83666aabd95edffa24ddddd49b8daff63adb851cdab74

  - name: poppler
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DENABLE_GLIB=ON
      - -DENABLE_GOBJECT_INTROSPECTION=OFF
      - -DENABLE_UTILS=OFF
      - -DENABLE_QT5=OFF
      - -DENABLE_QT6=OFF
      - -DENABLE_CPP=OFF
      - -DENABLE_BOOST=OFF
      - -DENABLE_GPGME=OFF
      - -DENABLE_NSS3=OFF
      - -DENABLE_LIBCURL=OFF
      - -DENABLE_DCTDECODER=libjpeg
      - -DENABLE_LIBOPENJPEG=openjpeg2
      - -DBUILD_GTK_TESTS=OFF
      - -DBUILD_QT5_TESTS=OFF
      - -DBUILD_QT6_TESTS=OFF
      - -DBUILD_CPP_TESTS=OFF
      - -DBUILD_MANUAL_TESTS=OFF
    sources:
      - type: archive
        url: https://poppler.freedesktop.org/poppler-26.08.0.tar.xz
        sha256: dc906e68cea698109706ac6aa3d2c9d4512fcfcac42d90b8afcda486d1b9abd0

  - name: lumen
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/lumen/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo build --release --locked
      - ./build-aux/compile-translations.sh target/locale
      - make install-files PREFIX=/app
    sources:
      - type: dir
        path: ../..
        skip:
          - target
          - .git
      - cargo-sources.json
