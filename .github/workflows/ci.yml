name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # Arch has the recent GTK, libadwaita and Poppler that Lumen needs.
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git rust gtk4 libadwaita poppler-glib \
            gettext appstream desktop-file-utils
      - uses: actions/checkout@v4
      - name: Formatting
        run: cargo fmt --check
      - name: Lints
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --locked
      - name: Desktop file and metadata
        run: |
          desktop-file-validate data/io.github.imanolgo.Lumen.desktop
          appstreamcli validate --no-net data/io.github.imanolgo.Lumen.metainfo.xml
      - name: Translations compile
        run: ./build-aux/compile-translations.sh target/locale
