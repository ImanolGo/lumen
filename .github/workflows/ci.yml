name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # Arch has the recent GTK, libadwaita and Poppler that Lumen needs.
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git rust gtk4 libadwaita poppler-glib libseccomp \
            gettext appstream desktop-file-utils dbus
      - uses: actions/checkout@v4
      - name: Formatting
        run: cargo fmt --check
      - name: Lints
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        # The end-to-end tests drive the real app on Broadway; they must run, not skip.
        env:
          LUMEN_REQUIRE_CONTROL_TESTS: "1"
        run: cargo test --locked
      - name: Translation template is up to date
        run: |
          ./build-aux/update-pot.sh
          # Only the file locations and the template date may differ; the messages must not.
          git diff --exit-code -I'^#:' -I'POT-Creation-Date' po/
      - name: Desktop file and metadata
        run: |
          desktop-file-validate data/io.github.imanolgo.Lumen.desktop
          appstreamcli validate --no-net data/io.github.imanolgo.Lumen.metainfo.xml
      - name: Translations compile
        run: ./build-aux/compile-translations.sh target/locale
